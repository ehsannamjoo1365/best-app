name: Python checks
on:
  push:
    paths:
      - 'telegram-market-bot/**'
  pull_request:
    paths:
      - 'telegram-market-bot/**'
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python source
        run: python -m py_compile telegram-market-bot/main.py
